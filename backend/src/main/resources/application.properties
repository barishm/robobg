#Database connection
spring.datasource.url=jdbc:postgresql://db:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}


#Admin Account
ADMIN_USERNAME=${ADMIN_USERNAME}
ADMIN_PASSWORD=${ADMIN_PASSWORD}
ADMIN_EMAIL=${ADMIN_EMAIL}

#JPA Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=FALSE
spring.jpa.properties.hibernate.show_sql=FALSE
spring.jpa.hibernate.ddl-auto=update
#Logging Levels -> Disable the default loggers
logging.level.org=WARN
logging.level.blog=WARN
#Show SQL executed with parameter bindings
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor=TRACE

#File logging, so errors can be tracked on the VPS (mounted to host via docker-compose LOGS_PATH volume)
logging.file.name=/logs/robobg.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

#port
server.port=8080

application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}
application.security.jwt.expiration=28800000
application.security.jwt.refresh-token.expiration=604800000
application.security.jwt.password-reset.expiration=900000

domain=${DOMAIN}
web.protocol=${WEB_PROTOCOL}

app.files.path=${APP_FILES_PATH}
database.backup.path=${BACKUP_PATH}
backup.bucket=${BACKUP_BUCKET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.cache.type=caffeine

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=barishm1337@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Secret keys
YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
CHANNEL_ID=${CHANNEL_ID}
spring.mail.password=${SPRING_MAIL_PASSWORD}
OPENAI_API_KEY=${OPENAI_API_KEY}

