# This is nginx config for local development, running outside of docker (WSL)


# Frontend: localhost
server {
    listen 80;
    server_name localhost;

    root /home/user/robobg/web/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}

# Backend API: api.localhost
server {
    listen 80;
    server_name api.localhost;

    client_max_body_size 10M;

    # Serve uploaded files (mounted from the app container via docker-compose)
    location /files/ {
        alias /home/user/robobg/files/;
        autoindex off;
    }

    # Reverse proxy to backend container (published on 8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
